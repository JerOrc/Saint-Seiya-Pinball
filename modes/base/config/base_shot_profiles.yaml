#config_version=6

shot_profiles:
  classic_shots_profile:
    states:
      - name: unlit
        show: off
      - name: flashing
        show: flash_color
        speed: 2
        show_tokens:
          color: (color)
      - name: lit
        show: led_color
        show_tokens:
          color: (color)
    loop: true

  manual_advance_shots_profile:
    states:
      - name: unlit
        show: off
      - name: flashing
        show: flash_color
        speed: 2
        show_tokens:
          color: (color)
      - name: lit
        show: led_color
        show_tokens:
          color: (color)
    advance_on_hit: false

  flashing_profile:
    states:
      - name: flashing
        show: flash_color
        show_tokens:
          color: (color)
        speed: 2
    advance_on_hit: false

  quick_flashing_profile:
    states:
      - name: flashing
        show: flash_color
        show_tokens:
          color: (color)
        speed: 4
    advance_on_hit: false

  jackpot_profile:
    states:
      - name: flashing
        show: flash_color
        show_tokens:
          color: (color)
        speed: 3
      - name: unlit
        show: off
    loop: false

  color_profile:
    states:
      - name: unlit
        show: "off"
      - name: lit
        show: led_color
        priority: 5
        show_tokens:
          color: (color)