#config_version=6

shots:
  activate_pf_multiplier_shot:
    switch: s_newton_ball_target
    profile: flashing_profile
    show_tokens:
      led: led_newton_ball_pf_multiplier
      color: FF0000
    enable_events: pf_multiplier_is_lit
    disable_events: activate_pf_multiplier_shot_hit
    hit_events: start_pf_multiplier

timers:
  pf_multiplier_timer:
    end_value: 1
    tick_interval: 5s
    control_events:
      - action: restart
        event: activate_pf_multiplier_shot_hit

variable_player:
  timer_pf_multiplier_timer_started:
    pf_multiplier:
      action: set
      int: current_player.missions_pf_multiplier
  timer_pf_multiplier_timer_complete:
    pf_multiplier:
      action: set
      int: 1

show_player:
  timer_pf_multiplier_timer_started:
    pf_multiplier_active:
      start_running: true
      speed: 50
  timer_pf_multiplier_timer_complete:
    pf_multiplier_active:
      action: stop
