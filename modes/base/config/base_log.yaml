#config_version=6

slide_player:
  priority: 1_000
  start_base_log: log
  stop_base_log:
    log:
      action: remove
  skill_failed:
    log:
      action: method
      method: log_text
      tokens:
        text: Skill failed
        background: red
  skill_success:
    log:
      action: method
      method: log_text
      tokens:
        text1: skill shot
        text2: = "+" + format_big_number([skill_score])
        text3: +1 Cosmo
        style: lightning
