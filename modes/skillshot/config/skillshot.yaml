#config_version=6
# 3 skillshots :
#   1. random 1 des 2 lanes au niveau des bumpers -> points + augmente son cosmos
#   Si on appuie sur le flipper gauche durant le lancé :
#     2. secret skillshot derrière la rampe gauche -> points + Bonus +5s pour les ball save sur cette bille
#

mode:
  start_events: start_mode_skillshot
  stop_events:
    - skill_failed
    - stop_mode_skillshot
    - stop_wizards
  events_when_started: mode_type_wizard_started
  events_when_stopped: mode_type_wizard_stopped
  priority: 1000

shots:
  skill_l:
    switch: s_dragon_lane_left
    profile: classic_shots_profile
    advance_events: mode_skillshot_started
    restart_events: mode_skillshot_will_stop
    show_tokens:
      led: led_dragon_lane_left
      color: 00FF00
  skill_r:
    switch: s_dragon_lane_right
    profile: classic_shots_profile
    restart_events: mode_skillshot_will_stop
    show_tokens:
      led: led_dragon_lane_right
      color: 00FF00
  super_skill_target:
    switch: s_newton_ball_target
    profile: classic_shots_profile
    control_events:
      - events: enable_skill
        state: 0
      - events: enable_super_skill
        state: 1
    show_tokens:
      led: led_newton_ball_jackpot
      color: FF0000

shot_groups:
  skillshots:
    shots: skill_l, skill_r
    enable_events: enable_skill
    disable_events: enable_super_skill, mode_skillshot_will_stop
    rotate_left_events: s_flipper_left_active
    rotate_right_events: s_flipper_right_active, random_right_lane
  super_skillshot:
    shots: super_skill_target
    enable_events: enable_super_skill
    disable_events: enable_skill, mode_skillshot_will_stop

variable_player:
  skill_success:
    skillshot_count: 1
    score: (50_000 + current_player.skillshot_count * 50_000) * current_player.pf_multiplier
  super_skill_success:
    super_skillshot_count: 1
    score: (100_000 + current_player.super_skillshot_count * 50_000) * current_player.pf_multiplier
  super_secret_skill_success:
    ballsave_bonus_time: 5
    super_skillshot_count: 1
    score: (150_000 + current_player.super_skillshot_count * 50_000) * current_player.pf_multiplier

event_player:
  mode_skillshot_started: enable_skill
  flipper_super_skill_active{device.switches.s_plunger_lane.state == 1}: enable_super_skill
  flipper_super_skill_released{device.switches.s_plunger_lane.state == 1}: enable_skill
  super_skill_success:
    - stop_mode_skillshot|2s
  super_secret_skill_success:
    - stop_mode_skillshot|1s
  skill_success:
    - cosmo_up|2s
    - stop_mode_skillshot|3s

random_event_player:
  enable_skill:
    events:
      - random_left_lane
      - random_right_lane

timers:
  skillshots_timeout:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 10s     # set the timeout of your skill shot here
    start_running: false
    control_events:
      - action: start
        event: balldevice_bd_plunger_ball_eject_success

state_machines:
  skillshots_success:
    debug: true
    states:
      start:
        label: Skill shots ready
      skill_success:
        label: Skill successful
        events_when_started: skill_success
      super_skill_success:
        label: Super skill successful
        events_when_started: super_skill_success
      super_secret_skill_success:
        label: Super secret skill successful
        events_when_started: super_secret_skill_success
      failed:
        label: Skill failed
        events_when_started: skill_failed
    transitions:
      - source: start
        target: skill_success
        events: skillshots_flashing_hit
      - source: start
        target: super_skill_success
        events: super_skillshot_hit
      - source: start
        target: super_secret_skill_success
        events: s_temple_secret_active
      - source: start
        target: failed
        events: skillshots_unlit_hit, timer_skillshots_timeout_complete, mode_skillshot_will_stop, s_spinner_right_active, sw_ramps_active, s_temple_out_active, sw_blue_targets_active, sw_red_targets_active, s_scoop_active, s_kickout_active, sw_bumpers_active

timed_switches:
  flipper_super_skill:
    switch_tags: left_flipper
    time: 1s

light_player:
  mode_skillshot_started:
    led_kickout_extraball: off
    led_scoop_mystery: off
    leds_red_target: off

show_player:
  super_skill_success:
    disc:
      loops: 0
      speed: 50

sound_player:
  skill_failed:
    Anime_Glass_Break_1_(alt)_low_pitch.mp3:
      bus: effects
      volume: 0.5
  skill_success:
    Anime_Pose_Sound:
      bus: effects
      volume: 0.5
  super_skill_success:
    Anime_Pose_Sound_(low_pitched):
      bus: effects
      volume: 0.5
