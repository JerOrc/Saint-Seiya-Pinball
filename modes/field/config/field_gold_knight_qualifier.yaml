#config_version=6

# When you start a game, a random saint is selected and its light starts blinking.
# Hit the center temple to start the battle. The door can be opened by hitting it once or by hitting the 2
# cygnus lock targets, located one on each side of the table.
# When not in a battle, hitting the captive ball will change the selected battle.
# You can't select again a finished battle until all battles are finished or a new game is started.

shots:
  select_saint:
    switch: s_newton_ball_target
  enter_saint_temple:
    switch: s_temple_in

achievements:
  saint_1:
    show_tokens:
      lights: led_gold_saint_1
    show_when_selected: flash # probably want to create a custom version of the "flash" show
    show_when_completed: on
    events_when_started: start_mode_gold_saint_1  # instant points award & plays shows
    enable_events: initialize_saints, reset_saints
    complete_events: mode_gold_saint_1_started
    reset_events: reset_saints
