achievement_groups:
  saints_awards:
    achievements:
      - saint_1
      - saint_2
      - saint_3
      - saint_4
      - saint_5
      - saint_6
      - saint_7
      - saint_8
      - saint_9
      - saint_10
      - saint_11
      - saint_12
    show_tokens:
      lights: led_temple_start_battle
    auto_select: true
    events_when_all_completed: saints_wizard_is_lit
    enable_while_no_achievement_started: false
    disable_while_achievement_started: true
    show_when_enabled: flash
    select_random_achievement_events: select_saint_hit
    allow_selection_change_while_disabled: false
    start_selected_events: enter_saint_temple_hit
    enable_events: initialize_saints
    disable_events: mode_field_will_stop
    debug: true

event_player:
  mode_field_started: initialize_saints
